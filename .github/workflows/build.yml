name: Build, test and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .tools
            ~/.local/share/godot/export_templates
          key: godot-4.7.2-${{ runner.os }}
      - name: Install Godot and matching export templates
        run: test -x .tools/godot || bash tools/install-godot.sh
      - name: Test and export all platforms
        run: bash tools/build.sh
      - name: Linux release smoke test
        run: build/linux/dog-slots.x86_64 --headless --quit-after 60
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-downloads
          path: build/downloads/*
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/web
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-downloads
          path: downloads
      - name: Publish versioned downloads and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" downloads/* --title "$TAG — Dachshunds & Huskies Slots" --generate-notes --verify-tag
